[package]
name = "uji"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
uji-agent = { path = "../agent" }
uji-ui = { path = "../ui" }
strum = { version = "0.28.0", features = ["derive"] }
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize"] }
calloop = "0.14.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "macros", "sync"] }
regex = "1"
globset = "0.4"

[lints]
workspace = true

[[bin]]
name = "uji"
path = "src/main.rs"
