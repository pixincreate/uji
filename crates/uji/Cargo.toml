[package]
name = "uji"
version.workspace = true
edition.workspace = true

[dependencies]
uji-api = { path = "../api" }
uji-core = { path = "../core" }
uji-screen = { path = "../screen" }
uji-tui = { path = "../tui" }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
ratatui = "0.30"
crossterm = "0.29"
calloop = "0.14.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "macros", "sync"] }
regex = "1"
globset = "0.4"
chrono-humanize = "0.2.3"
chrono = { version = "0.4.45", default-features = false }

[lints]
workspace = true
