[package]
name = "uji-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
build = "../uji/build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "uji-test"
path = "src/bin/uji-test.rs"

[dependencies]
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uji-kernel = { path = "../kernel" }
uji-lua = { path = "../../lua" }

[lints]
workspace = true
