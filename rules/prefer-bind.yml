id: prefer-bind
language: rust
severity: error
message: >-
  Build a Lua function that reaches the `Api` or the UI state with
  `bind(lua, api, ...)`: it is the one place the `Api` is cloned into a
  closure, and inside it `api.state()` borrows instead of cloning another `Rc`.
files:
  - "crates/uji/src/**"
ignores:
  - "crates/uji/src/api/bind.rs"
rule:
  any:
    - pattern: let $ALIAS = Rc::clone(api);
    - pattern: let $ALIAS = api.state();
    - all:
        - pattern: $LUA.create_function($$$)
        - has:
            stopBy: end
            any:
              - pattern: api
              - pattern: state
