id: prefer-iterator
language: rust
severity: error
message: >-
  Say what the loop is for with an iterator: `map`/`filter`/`collect` to build a
  collection, `find`/`any`/`position` to search.
constraints:
  EDIT:
    regex: "^(push|insert|remove|extend|push_str)$"
rule:
  any:
    # building a collection
    - pattern: |
        for $X in $ITER {
          $OUT.$EDIT($VALUE);
        }
    # searching: the whole body is one conditional exit
    - pattern: |
        for $X in $ITER {
          if $COND { return $RET; }
        }
    - pattern: |
        for $X in $ITER {
          if $COND {
            $BODY
            break;
          }
        }
